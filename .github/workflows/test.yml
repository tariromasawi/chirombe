name: test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/self-check.mjs
      - run: node --test tests/engine-integration.test.mjs tests/kernel-bridge.test.mjs
      - run: node engine/headless-runner.mjs
