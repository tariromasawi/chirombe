name: engine
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node engine/headless-runner.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "engine derived state"
